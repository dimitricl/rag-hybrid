ollama:
  host: "100.101.108.111"
  port: 11434

reranker:
  host: "127.0.0.1"
  port: 8765

web:
  port: 8080

rag:
  db_path: "~/.rag-hybrid"
  embed_model: "nomic-embed-text:latest"
  default_model: "qwen2.5:7b"
  # Nombre de chunks envoyés au reranker cross-encoder (ms-marco-MiniLM-L-6-v2)
  rerank_pool: 6
  # Nombre de chunks renvoyés dans le contexte LLM après reranking
  top_k: 3
  # Taille de la fenêtre de contexte Ollama en tokens
  # Plus élevé = le LLM voit plus de contexte, mais plus lent à générer
  num_ctx: 4096
  min_score: 0.30
  chunk_size: 1500
  chunk_overlap: 150
  # Fusion RRF : constante de lissage (plus élevé = résultats moins sensibles au rang)
  rrf_constant: 60.0
  # Poids FTS pour queries normales vs queries techniques (registres, acronymes, hex)
  fts_weight: 2.0
  fts_tech_weight: 5.0
  # Timeout HTTP vers le reranker Python en millisecondes
  reranker_timeout_ms: 500
  # Seuil de chunks au-dessus duquel HNSW remplace le full scan
  # En dessous : scan exact O(n) — au-dessus : HNSW approx O(log n)
  hnsw_threshold: 10000
  # Capacité max du cache LRU vecteurs en RAM (0 = illimité)
  # 10000 chunks × 768 dims × 4 bytes ≈ 30 MB
  vec_cache_size: 10000
